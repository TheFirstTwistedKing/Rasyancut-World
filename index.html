<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Rasyancut World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 아이콘 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3L21 12L12 21L3 12Z"/></g><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
      <symbol id="i-char" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3c-4 0-7 3-7 7v3l3 8h8l3-8v-3c0-4-3-7-7-7z"/><path d="M8.5 11l2.2 1M15.5 11l-2.2 1"/></g></symbol>
      <symbol id="i-art" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></g></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></g></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="bg-sigil" aria-hidden="true">
    <svg viewBox="-300 -300 600 600">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <circle r="280"/><circle r="236" stroke-dasharray="2 10"/><circle r="170"/><circle r="110" stroke-dasharray="1 7"/>
        <path d="M0 -240L240 0L0 240L-240 0Z"/><path d="M0 -170L170 0L0 170L-170 0Z" opacity=".6"/>
        <path d="M-300 0H300M0 -300V300" opacity=".5"/>
      </g>
    </svg>
  </div>

  <header class="topbar">
    <a class="brand" href="#/main" aria-label="메인으로">
      <svg width="22" height="22"><use href="#i-home"/></svg>
      <span>RASYANCUT<small>WORLD</small></span>
    </a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menuPanel">
      <i></i><i></i><i></i>
    </button>
  </header>

  <nav class="rail" id="rail" aria-label="주요 메뉴"></nav>

  <main id="screens">
    <section class="screen" id="s-main" hidden></section>
    <section class="screen" id="s-select" hidden></section>
    <section class="screen" id="s-char" hidden></section>
    <section class="screen" id="s-gallery" hidden></section>
    <section class="screen" id="s-notice" hidden></section>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="menu-panel" id="menuPanel" aria-label="메인 메뉴" inert>
    <p class="mono menu-kicker">MENU // R.S.S.</p>
    <nav class="menu-list" id="menuList"></nav>
    <p class="mono menu-foot">SANCTUARY OF ALL CREATIONS</p>
  </aside>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="컨셉아트 보기" hidden>
    <button class="lb-close" id="lbClose" type="button" aria-label="닫기"><svg width="20" height="20"><use href="#i-close"/></svg></button>
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전 그림"><svg width="22" height="22"><use href="#i-prev"/></svg></button>
    <figure class="lb-fig"><div class="lb-art" id="lbArt"></div><figcaption class="mono" id="lbCap"></figcaption></figure>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="다음 그림"><svg width="22" height="22"><use href="#i-next"/></svg></button>
  </div>

  <!-- 화면 전환 -->
  <div class="tr" id="tr" aria-hidden="true">
    <div class="tr-slats" id="trSlats"></div>
    <div class="tr-line" id="trLine"></div>
    <div class="tr-core" id="trCore">
      <svg viewBox="-40 -40 80 80" width="84" height="84">
        <circle class="tr-spin" r="32" fill="none" stroke="#d4a73a" stroke-width="1.2" stroke-dasharray="14 8 2 8"/>
        <circle r="18" fill="none" stroke="#f2d27a" stroke-width="1.6"/>
        <path d="M0 -18L18 0L0 18L-18 0Z" fill="none" stroke="#fff3c4" stroke-width="1"/>
        <circle r="4" fill="#fff3c4"/>
      </svg>
      <p class="mono" id="trLabel"></p>
    </div>
  </div>

  <script src="art.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
