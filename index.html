<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>라시안컷 월드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<button class="skip" id="skip" type="button">본문으로 건너뛰기</button>

<header class="hud" id="hud">
  <a class="brand" href="#/main" id="brand" aria-label="라시안컷 메인화면으로">
    <span class="brand-seal" id="brandSeal"></span>
    <span class="brand-word">RASYANCUT</span>
  </a>
  <p class="hud-where" id="hudWhere" aria-hidden="true"></p>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="메인 메뉴 열기" aria-expanded="false" aria-controls="menu">
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</header>

<main class="view" id="view" tabindex="-1" aria-label="화면">
  <!-- JS가 꺼져 있어도 이동은 되도록 둔 기본 안내 -->
  <noscript>
    <div class="ns">
      <p>이 사이트는 JavaScript가 필요합니다.</p>
    </div>
  </noscript>
  <div class="boot" id="boot" aria-live="polite">불러오는 중</div>
</main>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<nav class="menu" id="menu" aria-label="메인 메뉴" inert></nav>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="slats" id="slats"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="curtain-label"><span id="clNum">00</span><span id="clText"></span></p>
</div>

<p class="sr" id="live" role="status" aria-live="polite"></p>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
